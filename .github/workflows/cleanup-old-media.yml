name: Cleanup old Instagram media
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove media older than 7 days
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '7 days ago' +%s)
          changed=0
          if [ -d instagram ]; then
            while IFS= read -r -d '' dir; do
              newest=0
              while IFS= read -r -d '' file; do
                ts=$(git log -1 --format=%ct -- "$file" || true)
                if [ -n "$ts" ] && [ "$ts" -gt "$newest" ]; then newest=$ts; fi
              done < <(find "$dir" -type f -print0)
              if [ "$newest" -gt 0 ] && [ "$newest" -lt "$cutoff" ]; then
                rm -rf "$dir"
                changed=1
              fi
            done < <(find instagram -mindepth 1 -maxdepth 1 -type d -print0)
          fi
          if [ "$changed" -eq 1 ]; then
            git config user.name "DS Solucoes Automation"
            git config user.email "actions@users.noreply.github.com"
            git add -A instagram
            git commit -m "Remove Instagram media older than 7 days"
            git push
          else
            echo "No media older than 7 days."
          fi
