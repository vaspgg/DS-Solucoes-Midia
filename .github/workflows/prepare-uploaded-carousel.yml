name: Prepare uploaded carousel
on:
  push:
    paths:
      - 'DS_Solucoes_Carrossel_Corrigido_1080.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract carousel
        run: |
          rm -rf instagram/current
          mkdir -p instagram/current /tmp/carousel
          unzip -o DS_Solucoes_Carrossel_Corrigido_1080.zip -d /tmp/carousel
          i=1
          while IFS= read -r -d '' f; do
            n=$(printf "%02d" "$i")
            cp "$f" "instagram/current/$n.jpg"
            i=$((i+1))
          done < <(find /tmp/carousel -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | sort -z)
          test "$i" -eq 7
      - name: Validate images
        run: |
          test "$(find instagram/current -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 6
          for f in instagram/current/*.jpg; do
            test "$(head -c 2 "$f" | od -An -tx1 | tr -d ' \n')" = "ffd8"
            test "$(stat -c%s "$f")" -le 8388608
            file "$f"
          done
      - name: Commit validated media
        run: |
          git config user.name "DS Solucoes Automation"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/current
          git commit -m "Prepare corrected Instagram carousel"
          git push
